# PR pipeline (10-devops-infrastructure.md §3.1/§3.2/§3.6).
# Path-filtered monorepo jobs: the `changes` job computes the affected set once
# per run; every package job gates on it so 2-dev feedback loops stay fast.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      core-api: ${{ steps.filter.outputs.core-api }}
      agent-service: ${{ steps.filter.outputs.agent-service }}
      notify-service: ${{ steps.filter.outputs.notify-service }}
      python-any: ${{ steps.filter.outputs.python-any }}
      web: ${{ steps.filter.outputs.web }}
      ts-sdk: ${{ steps.filter.outputs.ts-sdk }}
      fhir: ${{ steps.filter.outputs.fhir }}
      keycloak: ${{ steps.filter.outputs.keycloak }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core-api:
              - 'services/core-api/**'
            agent-service:
              - 'services/agent-service/**'
            notify-service:
              - 'services/notify-service/**'
            python-any:
              - 'services/**'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'packages/ts-sdk/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            ts-sdk:
              - 'packages/ts-sdk/**'
            fhir:
              - 'platform/fhir/**'
            keycloak:
              - 'platform/keycloak/**'
            docs:
              - 'docs/**'
              - '**/*.md'

  # ---------------------------------------------------------------------------
  # Python services: ruff (lint+format), mypy strict, pytest unit (10 §3.2)
  # ---------------------------------------------------------------------------
  python:
    needs: changes
    if: needs.changes.outputs.python-any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [core-api, agent-service, notify-service]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs[matrix.service] == 'true'

      - uses: ./infra/ci/actions/setup-python-uv
        if: needs.changes.outputs[matrix.service] == 'true'
        with:
          working-directory: services/${{ matrix.service }}

      - name: ruff lint + format check
        if: needs.changes.outputs[matrix.service] == 'true'
        working-directory: services/${{ matrix.service }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy (strict)
        if: needs.changes.outputs[matrix.service] == 'true'
        working-directory: services/${{ matrix.service }}
        run: uv run mypy --strict .

      - name: pytest (unit — no I/O)
        if: needs.changes.outputs[matrix.service] == 'true'
        working-directory: services/${{ matrix.service }}
        run: uv run pytest -q

      - name: pip-audit (dependency vulnerabilities, 10 §3.5)
        if: needs.changes.outputs[matrix.service] == 'true'
        working-directory: services/${{ matrix.service }}
        # Gating: baseline verified clean 2026-07-23 (SECURITY-REVIEW.md §2).
        # A newly-disclosed CVE fails the build — triage + pin/override to fix.
        run: uv run --with pip-audit pip-audit --strict

  # ---------------------------------------------------------------------------
  # web + ui: eslint, tsc --noEmit, vitest (10 §3.2)
  # (Storybook build + axe checks join once packages/ui components land)
  # ---------------------------------------------------------------------------
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (dependency vulnerabilities)
        # Gating on high+ : baseline verified clean 2026-07-23 (SECURITY-REVIEW.md
        # §2, after patching 5 high Next.js CVEs). Transitive fixes go through
        # pnpm.overrides in the root package.json.
        run: pnpm audit --prod --audit-level high
      - name: eslint
        run: pnpm -r --filter ./apps/web --filter ./packages/ui lint
      - name: typecheck
        run: pnpm -r --filter ./apps/web --filter ./packages/ui exec tsc --noEmit
      - name: vitest
        run: pnpm -r --filter ./apps/web --filter ./packages/ui test

  # ---------------------------------------------------------------------------
  # ts-sdk contract-gen check (10 §3.2): regenerate clients from each service's
  # exported OpenAPI schema; an API change without a regenerated, committed SDK
  # fails the build. Skipped when neither services nor the sdk changed.
  # ---------------------------------------------------------------------------
  ts-sdk-contract:
    needs: changes
    if: needs.changes.outputs.python-any == 'true' || needs.changes.outputs.ts-sdk == 'true'
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate SDK from exported OpenAPI schemas
        # PLACEHOLDER until packages/ts-sdk generation lands (S1/S2 handshake):
        # expected shape — each service exports openapi.json without booting
        # (uv run python -m app.export_openapi), then:
        #   pnpm --filter @medagent/ts-sdk generate
        run: |
          if pnpm --filter @medagent/ts-sdk run --if-present generate; then
            echo "SDK regenerated"
          else
            echo "ts-sdk generate script not present yet (S1 scaffold) — check is a no-op"
          fi
      - name: Fail on uncommitted drift
        run: git diff --exit-code -- packages/ts-sdk

  # ---------------------------------------------------------------------------
  # platform/fhir: Java interceptor build + tests, Java 17 (10 §3.2)
  # ---------------------------------------------------------------------------
  fhir:
    needs: changes
    if: needs.changes.outputs.fhir == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build + unit tests (JUnit)
        working-directory: platform/fhir
        run: mvn -B verify
      # FHIR profile/IG validation against the HAPI validator CLI joins here
      # once profiles land (10 §3.2)

  # ---------------------------------------------------------------------------
  # platform/keycloak: realm JSON validation + config-cli dry-run against a
  # throwaway Keycloak container (10 §3.2). Keycloak needs a start command, so
  # it runs via docker rather than a GitHub service container.
  # ---------------------------------------------------------------------------
  keycloak-config:
    needs: changes
    if: needs.changes.outputs.keycloak == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate realm JSON is well-formed
        run: |
          for f in platform/keycloak/realm/*.json; do
            jq empty "$f" && echo "ok: $f"
          done

      - name: Boot throwaway Keycloak
        run: |
          docker network create kc-net
          docker run -d --name kc --network kc-net \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=throwaway \
            -e KC_HEALTH_ENABLED=true \
            quay.io/keycloak/keycloak:26.0 start-dev
          for i in $(seq 1 60); do
            if docker run --rm --network kc-net curlimages/curl:8.13.0 \
                 -fsS http://kc:9000/health/ready >/dev/null 2>&1; then
              echo "keycloak ready"; exit 0
            fi
            sleep 5
          done
          echo "keycloak never became ready"; docker logs kc; exit 1

      - name: config-cli dry-run (validate import against live server)
        run: |
          docker run --rm --network kc-net \
            -v "$PWD/platform/keycloak/realm:/config:ro" \
            -e KEYCLOAK_URL=http://kc:8080 \
            -e KEYCLOAK_USER=admin \
            -e KEYCLOAK_PASSWORD=throwaway \
            -e IMPORT_FILES_LOCATIONS='/config/*.json' \
            -e IMPORT_VALIDATE=true \
            adorsys/keycloak-config-cli:6.4.0-26.0

      - name: Teardown
        if: always()
        run: docker rm -f kc || true; docker network rm kc-net || true

  # ---------------------------------------------------------------------------
  # docs: markdown link check — docs changes never trigger service jobs (10 §3.2)
  # ---------------------------------------------------------------------------
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments 'docs/**/*.md' '*.md'
          fail: true

  # ---------------------------------------------------------------------------
  # Secret scanning — full history, every run, never skipped (10 §3.6; direct
  # lesson from the prototype's committed plaintext credentials)
  # ---------------------------------------------------------------------------
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — leaked-then-deleted secrets still fail
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
