# SOPS configuration — Phase A vault (ADR DI-3, 10 §5).
# Encrypted secrets per environment: infra/secrets/{env}.enc.yaml.
# age recipients: the two developers (hardware-backed where possible) + one CI
# deploy key per deploy environment (held as a GitHub environment secret).
# Root-key rotation: yearly, and on ANY team change — re-encrypt all files.
#
# PLACEHOLDER RECIPIENTS — replace with real age public keys before the first
# encrypted file is committed. Never commit a plaintext {env}.yaml.
keys:
  - &dev_banula age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqplc0d1 # placeholder
  - &dev_second age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqplc0d2 # placeholder
  - &ci_dev age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqplc0d3 # placeholder
  - &ci_staging age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqplc0d4 # placeholder
  - &ci_pilot age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqplc0d5 # placeholder

creation_rules:
  # shared-dev: both developers + the dev CI deploy key
  - path_regex: infra/secrets/dev\.enc\.yaml$
    age:
      - *dev_banula
      - *dev_second
      - *ci_dev

  # staging: developers + staging CI deploy key only
  - path_regex: infra/secrets/staging\.enc\.yaml$
    age:
      - *dev_banula
      - *dev_second
      - *ci_staging

  # pilot (prod): developers + pilot deploy key — scoped to the protected
  # GitHub environment with required-reviewer approval
  - path_regex: infra/secrets/pilot\.enc\.yaml$
    age:
      - *dev_banula
      - *dev_second
      - *ci_pilot

  # refuse to encrypt anything not matched above (no stray secret files)
