# Shared composite action — Python toolchain for services/* jobs (10 §3.2).
# Workflows live in .github/workflows/ (GitHub requirement); shared CI pieces
# live here in infra/ci/ per the monorepo layout (01 §2).
name: Setup Python + uv
description: Install uv (with cache) and sync a service's locked environment

inputs:
  working-directory:
    description: Service directory containing pyproject.toml + uv.lock
    required: true
  python-version:
    description: Python version to install
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "${{ inputs.working-directory }}/uv.lock"

    - name: Install Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Sync locked environment (dev deps included)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --frozen
