[project]
name = "core-api"
version = "0.1.0"
description = "MedAgent core-api — BFF, MPI, queue, scheduling, consent/audit write paths (S1 skeleton)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    # OTel is declared now; wiring is a TODO stub (app/telemetry.py) per 10 §6.
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "ASYNC", "RUF"]
ignore = [
    "S101", # assert is fine in tests; kept globally simple for the skeleton
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"] # dummy secrets in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
