# Alembic configuration for app_db (core-api-owned tables).
# 10 §9: Alembic is the ONLY schema mechanism for app_db; hapi_db is never touched.

[alembic]
script_location = alembic
prepend_sys_path = .
# Real URL comes from the DATABASE_URL env var (see alembic/env.py); this is a
# dummy fallback for local tooling only.
sqlalchemy.url = postgresql+asyncpg://core_api:dummy-password@localhost:5432/app_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
